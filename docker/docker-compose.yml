# Reference self-host deployment: one server container + one named volume
# for a local SQLite file (via libSQL's file: URL scheme -- no external
# account needed). Point your own build of apps/web at this server via
# VITE_SYNC_SERVER_URL (see apps/web/README or the root README).
#
# Prefer a hosted Turso database instead of the local volume? Drop the
# `volumes:` line below and set DATABASE_URL to your libsql://... URL plus
# DATABASE_AUTH_TOKEN -- useful if you're deploying to a host with no
# persistent disk (see the root README's "Live" section for why).
#
# Usage: docker compose -f docker/docker-compose.yml up -d
services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    ports:
      - "1234:1234"
    environment:
      PORT: 1234
      DATABASE_URL: file:/data/tandem.sqlite
      # MAX_ROOM_BYTES: "5242880"
    volumes:
      - tandem-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1234/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  tandem-data:
