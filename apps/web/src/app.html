<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<!--
			These live here, not in +layout.svelte's <svelte:head>, because ssr is
			disabled site-wide (Yjs/IndexedDB are client-only) -- with no SSR pass,
			<svelte:head> content only appears after client JS hydrates, so a tag
			needed in the raw static shell itself (manifest for installability
			checks, favicon, iOS PWA meta) has to be here instead.
		-->
		<link rel="icon" href="/favicon.svg" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#fafadf" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
